name: Pages Live Demo

on:
  push:
    branches: [main]
    paths:
      - "docs/dashboard.html"
      - ".github/workflows/pages-demo.yml"
      - "src/**"
      - "pyproject.toml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and optional deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all]"

      - name: Collect demo metrics
        run: |
          python - <<'PY'
          import json
          import time
          from pathlib import Path
          from src.platform_adapter import select_default_probe
          from src.power_monitor import select_default_source

          probe = select_default_probe()
          source = select_default_source()

          metrics = probe.read_metrics()
          reading = source.read_once(timeout_ms=1000)

          summary = {
              "cpu_avg": metrics.cpu_percent,
              "mem_used_avg_mb": metrics.mem_used_mb,
              "mem_total_mb": metrics.mem_total_mb,
              "gpu_avg": metrics.gpu_percent,
              "gpu_mem_used_avg_mb": metrics.gpu_mem_used_mb,
              "temp_max_c": metrics.temperature_c,
              "power_avg_watt": reading.power_watt,
              "ts_ms": int(time.time() * 1000),
              "probe": probe.name,
              "power_source": reading.source_name,
          }

          out_dir = Path("gh-pages")
          out_dir.mkdir(exist_ok=True)
          (out_dir / "demo_summary.json").write_text(
              json.dumps(summary, indent=2, ensure_ascii=False), encoding="utf-8"
          )
          print("Summary:", summary)
          PY

      - name: Prepare GitHub Pages artifact
        run: |
          cp docs/dashboard.html gh-pages/index.html
          # Patch the online demo to read the local demo_summary.json instead of localhost API
          sed -i "s|const API_BASE = 'http://localhost:8080';|const API_BASE = '.';|" gh-pages/index.html
          sed -i "s|fetch(\`\${API_BASE}/api/summary\`)|fetch(\`\${API_BASE}/demo_summary.json\`)|" gh-pages/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: gh-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

services:
  ai-edge-monitor:
    build: .
    image: ai-edge-monitor:latest
    container_name: ai-edge-monitor
    ports:
      - "17429:17429"
    volumes:
      - ./reports:/app/reports
    # Override default command if you prefer one-shot run instead of dashboard
    # command: ["ai-edge-monitor", "run", "--duration", "300", "--out", "/app/reports"]
    restart: unless-stopped
